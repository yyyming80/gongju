version: '3.8'

services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: toolbox-mysql
    environment:
      MYSQL_ROOT_PASSWORD: abc.123
      MYSQL_DATABASE: toolbox
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./toolbox-java/src/main/resources/db-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - toolbox-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pabc.123"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Rembg服务 - Python Flask
  rembg:
    build:
      context: ./toolbox-rembg
      dockerfile: Dockerfile
    container_name: toolbox-rembg
    ports:
      - "5000:5000"
    networks:
      - toolbox-network
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot后端
  backend:
    build:
      context: ./toolbox-java
      dockerfile: Dockerfile
    container_name: toolbox-backend
    ports:
      - "8080:8080"
    volumes:
      - upload-data:/app/uploads
    networks:
      - toolbox-network
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/toolbox?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=abc.123
      - REMBG_API_URL=http://rembg:5000
      - TOOLBOX_UPLOAD_PATH=/app/uploads
      - TOOLBOX_FILE_BASE_URL=http://localhost:8080/files/
    depends_on:
      mysql:
        condition: service_healthy
      rembg:
        condition: service_healthy

  # Vue前端
  frontend:
    build:
      context: ./toolbox-web
      dockerfile: Dockerfile
    container_name: toolbox-frontend
    ports:
      - "3000:80"
    networks:
      - toolbox-network
    depends_on:
      - backend

volumes:
  mysql-data:
  upload-data:

networks:
  toolbox-network:
    driver: bridge
