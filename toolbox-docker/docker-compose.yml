version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: toolbox-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: abc.123
      MYSQL_DATABASE: toolbox
      MYSQL_USER: toolbox
      MYSQL_PASSWORD: abc.123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - toolbox-network

  redis:
    image: redis:7-alpine
    container_name: toolbox-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - toolbox-network

  minio:
    image: minio/minio
    container_name: toolbox-minio
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - toolbox-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: toolbox-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - toolbox-network

  server:
    build:
      context: ../toolbox-java
      dockerfile: toolbox-application/Dockerfile
    container_name: toolbox-server
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/toolbox?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: abc.123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis
      - rabbitmq
    networks:
      - toolbox-network

  web:
    build:
      context: ../toolbox-vue
      dockerfile: Dockerfile
    container_name: toolbox-web
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - server
    networks:
      - toolbox-network

  nginx:
    image: nginx:alpine
    container_name: toolbox-nginx
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
      - server
    networks:
      - toolbox-network

volumes:
  mysql_data:
  redis_data:
  minio_data:

networks:
  toolbox-network:
    driver: bridge
